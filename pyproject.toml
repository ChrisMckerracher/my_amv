[project]
name = "my-amv"
version = "0.1.0"
description = "AMV (Anime Music Video) art pipeline: video + audio -> processed art video with audio-reactive effects"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chris McK" }
]

dependencies = [
    "torch>=2.0",
    "torchvision",
    "opencv-python",
    "opencv-contrib-python",
    "numpy",
    "Pillow",
    "librosa",
    "soundfile",
    "ffmpeg-python",
    "controlnet-aux",
    "transformers",
    "diffusers",
    "accelerate",
    "pydantic>=2.0",
    "pyyaml",
    "typer",
    "svgwrite",
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
3d = [
    "open3d",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=src/my_amv --cov-report=term-missing"
markers = ["integration: end-to-end integration tests (require ffmpeg)"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "librosa.*",
    "controlnet_aux.*",
    "diffusers.*",
    "svgwrite.*",
    "skimage.*",
    "open3d.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["my_amv"]
